<!-- Ruta: marca/icono.svg -->
<!-- Icono de OberDesk. De aqui salen todos los tamaños (icono.png y los del instalador). -->
<!-- Es una pantalla con un puntero dentro: lo que hace el programa es entrar en la pantalla -->
<!-- de otro. Los colores son los de la ficha de OberDesk en dnns.es. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b21b6"/>
      <stop offset="0.55" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="brillo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#fondo)"/>
  <rect width="512" height="256" rx="112" fill="url(#brillo)"/>

  <g fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <rect x="96" y="128" width="320" height="214" rx="30"/>
    <path d="M208 384h96M256 342v42"/>
  </g>

  <!-- puntero dentro de la pantalla -->
  <path d="M222 184l96 48-42 15-15 42z" fill="#ffffff"/>
</svg>
