# Fecha: 2026-10-16
# Ruta: marca/marca.conf
# Datos de OberDesk. Los lee aplicar-marca.sh, que es quien convierte el codigo
# de RustDesk en OberDesk durante la compilacion.
#
# OJO: si cambia SERVIDOR o CLAVE hay que volver a compilar y a repartir el programa;
# los que ya esten instalados seguirian apuntando a lo viejo.

# Nombre que ve el usuario: ventana, menus, instalador, accesos directos.
NOMBRE="OberDesk"

# Nombre del ejecutable y de la carpeta de instalacion (sin espacios ni acentos).
EJECUTABLE="oberdesk"

# Quien firma el programa en las propiedades del archivo y en el instalador.
EMPRESA="DNNS"

# Servidor propio al que se conecta el programa. Sin puerto: va aparte.
SERVIDOR="oberdesk.dnns.es"

# Clave publica del servidor. Sin ella el servidor rechaza al cliente.
CLAVE="trLlW9jHfh2WspHxnsTyLRUncjOmlUuvGHaJizkwd40="

# Pagina del programa, para los enlaces de "acerca de" y de ayuda.
WEB="https://dnns.es/apps.html#oberdesk"

# Colores. Los mismos del icono, para que el programa y la web vayan a juego.
# El motor de RustDesk es azul en todas sus pantallas; esto es lo que hace que
# OberDesk no parezca el programa de otros con otro nombre encima.
# Son los verdes de dnns.es (--verde-osc, --verde y uno mas oscuro para rematar).
COLOR_PRINCIPAL="4A9638"   # verde oscuro: titulos, selecciones, acentos
COLOR_BOTON="69C350"       # verde DNNS: botones
COLOR_OSCURO="2E6B23"      # el mas oscuro: el numero de ID y el borde de la ventana
